name: orca_order
description: Orca Order app
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  fl_chart: ^1.2.0
  pdf: ^3.10.8
  path_provider: ^2.1.2
  printing: ^5.12.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.1
  provider: ^6.1.1
  intl: ^0.20.2
  drift: ^2.16.0
  sqlite3_flutter_libs: 0.5.20
  path: ^1.9.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.png"
  adaptive_icon_background: "#00658F"
  adaptive_icon_foreground: "assets/icon/app_logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/app_icon.png

  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
